version: "3.9"

services:
  backend1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: backend1
    environment:
      - SERVER_PORT=8080

  backend2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: backend2
    environment:
      - SERVER_PORT=8080

  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
